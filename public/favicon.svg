<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181E2A" />
      <stop offset="100%" stop-color="#0B0E14" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Minimalist Running Cadence Wave / Runner Mark -->
  <!-- Forward stride track lines -->
  <path
    d="M16 46 C24 46, 28 38, 32 30 C36 22, 40 18, 48 18"
    fill="none"
    stroke="url(#amberGlow)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Secondary Kinetic Pace Arc -->
  <path
    d="M18 36 C24 36, 28 30, 34 24"
    fill="none"
    stroke="#FBBF24"
    stroke-opacity="0.4"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Velocity Impulse Dot / Precision Target -->
  <circle cx="48" cy="18" r="4.5" fill="#FBBF24" />
  <circle cx="48" cy="18" r="8" fill="#FBBF24" fill-opacity="0.2" />

  <!-- Lower grounding sprint tick -->
  <path
    d="M32 46 L46 46"
    fill="none"
    stroke="url(#amberGlow)"
    stroke-width="4"
    stroke-linecap="round"
  />
</svg>
